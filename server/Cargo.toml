[package]
name = "sif-studio-server"
version = "0.1.0"
description = "联锁逻辑图与仪表台账的在线工作台后端（SIF Studio / 联锁工坊 · Web 版）"
authors = ["SIF Studio Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sif_studio_lib"
crate-type = ["rlib"]

[[bin]]
name = "sif-studio-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
csv = "1.3"
calamine = "0.26"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
# 阶段 B：密码哈希（argon2id）+ 会话 token 随机数
argon2 = "0.5"
rand = "0.8"
# 阶段 C：备份/恢复/导入的临时落盘文件（处理完自动删除）
tempfile = "3"

[dev-dependencies]
# B6c：oneshot 直打 axum Router（不起 TCP）
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
